<style>
/* Layout: full-bleed 3D planet; slim instrument bar on top; inspector docked left, company ledger docked right; one-at-a-time sheets on phones */

 --night:#09101c; --panel:rgba(16,24,39,.95); --panel2:#172238; --line:#28354f; --paper:#ece6d6; --muted:#8f98ad;
 --sodium:#f2a93b; --sodium-ink:#1d1405; --teal:#3fb0bf; --good:#78cf98; --bad:#ef6a5e;

 color-scheme:dark;
}
[hidden]{display:none!important}
#front{position:fixed;inset:0;z-index:60;overflow:auto;background:#07080a}
.fr-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#07080a}
.fr-shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 45%,rgba(7,8,10,.15),rgba(7,8,10,.72) 100%),linear-gradient(180deg,rgba(7,8,10,.55),rgba(7,8,10,0) 28%,rgba(7,8,10,0) 60%,rgba(7,8,10,.7))}

.fr-hero{margin:0 0 18px;text-align:center;color:#e9e3d0;font-size:15px;line-height:1.45;max-width:380px;text-shadow:0 2px 14px #000}.fr-hero b{color:var(--sodium)}
#front .fr-logo{font-size:60px;white-space:nowrap;margin-bottom:10px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7))}
#front .fr-card{background:rgba(14,15,18,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-color:rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,222,0,.06)}
#front .fr-body{background:rgba(10,11,13,.55)}
#front .fr-foot{text-shadow:0 1px 8px #000;color:#9a9da4}
.fr-cities{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.fr-cities span{font:700 10.5px ui-monospace,monospace;letter-spacing:.1em;color:#c9c5b5;background:rgba(255,255,255,.06);border-radius:3px;padding:5px 8px}
.fr-acct{display:flex;align-items:center;gap:10px;background:rgba(255,222,0,.07);border:1px solid rgba(255,222,0,.2);border-radius:6px;padding:9px 12px;margin:0 0 16px;font-size:13px}.fr-acct b{display:block;font-size:13px;word-break:break-all}.fr-acct small{color:#8a8d94;font-size:11.5px}.fr-acct .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sodium);color:#000;font:700 15px/30px var(--f-display);text-align:center;text-transform:uppercase}.fr-acct button{margin-left:auto;flex:none;background:none;border:1px solid #3a3d44;color:#c9c5b5;border-radius:4px;padding:5px 9px;font-size:12px;cursor:pointer}.fr-acct button:hover{border-color:var(--sodium);color:var(--sodium)}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #1d1f23;margin-top:14px}.au-tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:#8a8d94;padding:12px 0 11px;font:700 12px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.au-tabs button.on{color:var(--sodium);border-bottom-color:var(--sodium)}
.au-f{display:flex;flex-direction:column;gap:10px}.au-f input{width:100%;box-sizing:border-box;background:#0a0b0c;border:2px solid #2a2c31;border-radius:6px;color:var(--paper);padding:12px;font:inherit;font-size:16px}.au-f input:focus{outline:none;border-color:var(--sodium)}
.au-msg{min-height:18px;font-size:13px;line-height:1.4;margin:0}.au-msg.err{color:var(--bad)}.au-msg.ok{color:var(--good)}
.au-row{display:flex;justify-content:space-between;gap:10px;margin-top:2px}.au-row .fr-link{margin:0;font-size:12.5px}
.fr-play[disabled]{opacity:.6;cursor:wait}.fr-ghost{width:100%;margin-top:10px;background:none;border:2px solid #34373e;border-radius:6px;color:#d9d5c4;padding:11px;font:700 12px ui-monospace,monospace;letter-spacing:.1em;cursor:pointer;text-transform:uppercase}.fr-ghost:hover{border-color:var(--sodium);color:var(--sodium)}
.au-hint{margin:6px 0 0;font-size:12px;line-height:1.4;color:#8a8d94}.au-hint a,.au-chk a{color:var(--sodium)}
.au-chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:#c9c5b5;cursor:pointer}.au-chk input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--sodium)}
.au-f input[type=date]{color-scheme:dark;min-height:46px}
.au-or{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:#6c6f76;font:11px ui-monospace,monospace;letter-spacing:.12em}.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:#26282d}
@media (max-width:520px){#front .fr-logo{font-size:44px}#front .fr-logo .flag.big{width:50px;height:34px}}
.fr-glow{position:fixed;inset:0;background:radial-gradient(60% 70% at 0% 30%,rgba(255,222,0,.16),transparent 70%),radial-gradient(50% 60% at 100% 70%,rgba(255,222,0,.07),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 2px,transparent 2px 22px);filter:blur(1px);pointer-events:none}
.fr-wrap{position:relative;max-width:470px;margin:0 auto;padding:56px 16px 40px;display:flex;flex-direction:column;align-items:center}
.fr-logo{font-family:var(--f-display);font-size:58px;letter-spacing:.05em;color:var(--sodium);display:flex;align-items:center;gap:6px;margin-bottom:22px;text-shadow:0 4px 0 #000}.fr-logo .flag.big{width:62px;height:42px;margin:0 10px 0 0}
.fr-card{width:100%;background:#141518;border:2px solid #23252a;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.fr-top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 0}.fr-tag{background:rgba(255,222,0,.12);color:var(--sodium);font:700 11px/1 ui-monospace,monospace;letter-spacing:.12em;padding:6px 9px;border-radius:3px}.fr-who{font:11px ui-monospace,monospace;letter-spacing:.12em;color:#8a8d94}
.fr-card h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.02em;margin:12px 22px 6px;line-height:1}.fr-sub{margin:0 22px 18px;color:#a8abb2;font-size:14px;line-height:1.5}
.fr-body{border-top:2px solid #1d1f23;padding:18px 22px 20px;background:#111214}
.fr-lbl{display:block;font:700 11px ui-monospace,monospace;letter-spacing:.12em;color:#8a8d94;margin-bottom:6px;text-transform:uppercase}#frname{width:100%;box-sizing:border-box;background:#0a0b0c;border:2px solid #2a2c31;border-radius:6px;color:var(--paper);padding:11px 12px;font:inherit;font-size:15px;margin-bottom:16px}#frname:focus{border-color:var(--sodium);outline:none}
.fr-feat{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:12px}.fr-feat li{display:flex;gap:12px}.fr-feat i{color:var(--sodium);font-style:normal;font-size:13px;margin-top:2px}.fr-feat b{display:block;font-size:14px}.fr-feat small{color:#8a8d94;font-size:12.5px}
.fr-play{width:100%;background:var(--sodium);color:#000;border:0;border-radius:6px;padding:15px;font-family:var(--f-display);font-size:26px;letter-spacing:.08em;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);cursor:pointer}.fr-play:hover{filter:brightness(1.08)}.fr-play:active{transform:translateY(2px)}
.fr-meta{text-align:center;font:11px ui-monospace,monospace;letter-spacing:.1em;color:#8a8d94;margin:12px 0 4px}.fr-meta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px}
.fr-lb{margin-top:16px;border-top:2px solid #1d1f23;padding-top:12px;font-size:13px}.fr-lbh{font:700 11px ui-monospace,monospace;letter-spacing:.12em;color:#8a8d94;margin-bottom:6px}.fr-lb div{display:flex;justify-content:space-between;padding:3px 0}.fr-lb .me{color:var(--sodium)}
.fr-link{display:block;margin:14px auto 0;background:none;border:0;color:#8a8d94;text-decoration:underline;font-size:13px;cursor:pointer}.fr-foot{color:#6c6f76;font-size:13px;margin-top:18px}
.lb{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}.lb li{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;background:#1b1b1b;border-radius:10px;padding:9px 12px}.lb li.me{box-shadow:inset 0 0 0 2px var(--sodium)}.lb .rk{font-family:var(--f-display);font-size:22px;color:var(--sodium)}.lb small{color:var(--muted)}
#moneybox{position:relative;align-items:flex-end;padding:4px 10px 4px 12px;border-radius:12px;background:#141414;box-shadow:inset 0 0 0 2px #232323;transition:box-shadow .3s}
#moneybox .mrow{display:flex;flex-direction:row;align-items:center;gap:10px;flex-wrap:nowrap}#spark{width:64px;height:22px;opacity:.9;flex:none}#moneybox{padding:3px 10px 3px 10px}#moneybox small{line-height:1.1}
#moneybox.up{animation:mbup .7s ease}#moneybox.down{animation:mbdn .7s ease}
@keyframes mbup{0%{transform:scale(1)}25%{transform:scale(1.08);box-shadow:inset 0 0 0 2px var(--good),0 0 22px rgba(123,224,143,.5)}100%{transform:scale(1)}}
@keyframes mbdn{0%{transform:translateX(0)}20%{transform:translateX(-4px);box-shadow:inset 0 0 0 2px var(--bad)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}100%{transform:none}}
#cash.rolling{color:#fff6b0}
#cashfx{position:absolute;right:8px;top:100%;pointer-events:none;width:0;height:0}
.cfx{position:absolute;right:0;top:0;white-space:nowrap;font-family:var(--f-display);font-size:30px;letter-spacing:.02em;text-shadow:0 3px 0 #000;animation:cfx 1.9s ease-out forwards}
.cfx.up{color:var(--good)}.cfx.down{color:var(--bad)}
@keyframes cfx{0%{transform:translateY(-6px) scale(.6);opacity:0}15%{transform:translateY(4px) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(46px) scale(1);opacity:0}}
.coin{position:absolute;right:30px;top:-20px;width:14px;height:14px;border-radius:50%;background:#ffde00;border:2px solid #000;box-shadow:inset -3px -3px 0 #d4b000;animation:coin 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes coin{0%{transform:translate(var(--sx),60px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(0,0) scale(1);opacity:0}}
#skipbtn{font-size:13px}
.skipdd{right:auto;left:50%;transform:translateX(-50%);width:260px}.skipdd button b{display:block;font-size:14px}
#skipov{position:fixed;z-index:44;left:50%;top:calc(var(--bar-h,62px) + 14px);transform:translateX(-50%);background:#0f0f0f;border:3px solid var(--sodium);border-radius:14px;padding:12px 18px;min-width:280px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.45)}
#skipov .sk-t{font-family:var(--f-display);font-size:26px;color:var(--sodium);letter-spacing:.06em}#skipov .sk-d{font-weight:700;margin:2px 0 8px}
#skipov .sk-bar{height:8px;border-radius:5px;background:#262626;overflow:hidden;margin-bottom:8px}#skipov .sk-bar i{display:block;height:100%;width:0;background:var(--sodium);transition:width .12s}
#skipov .sk-p{font-family:var(--f-display);font-size:30px;margin-bottom:8px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 12px}.sumgrid div{background:#1b1b1b;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}.sumgrid small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.sumgrid b{font-family:var(--f-display);font-size:30px;font-weight:400}
.renrow{display:flex;gap:8px;margin-bottom:6px}.renrow input{flex:1;min-width:0;background:#0a0a0a;border:2px solid #2c2c2c;border-radius:8px;color:var(--paper);padding:8px 10px;font:inherit}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;border:3px solid #000;box-shadow:0 0 0 2px #2c2c2c}.sw.on{box-shadow:0 0 0 3px var(--sodium)}
.btn.wide,.ghost.wide{width:100%;margin:8px 0 4px;padding:10px}
.nexts{display:flex;flex-direction:column;gap:10px}.nx{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:#1b1b1b;border:2px solid #262626;border-radius:12px;padding:12px}
.nx .nn{width:34px;height:34px;border-radius:50%;background:var(--sodium);color:#000;font-family:var(--f-display);font-size:22px;display:grid;place-items:center}.nx b{display:block;font-size:15px}.nx small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 8px;line-height:1.4}
.checks .gt{display:flex;flex-direction:column;flex:1}.checks .gh{color:var(--muted);font-size:12px;font-family:var(--f-body)}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#fade{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#e9f0f5,#b9cbd9);opacity:0;pointer-events:none;z-index:5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--good)}.down{color:var(--bad)}
.eyebrow{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.eyebrow:first-child{margin-top:0}
.h{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,9vw,76px);line-height:.88;text-transform:uppercase;margin:0;color:var(--sodium);letter-spacing:.02em}
.muted{color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:8px 0 0}
.warn{color:var(--sodium);font-size:12.5px;margin:8px 0 0}
p{margin:0 0 10px}

/* top bar */
#bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:linear-gradient(180deg,rgba(9,16,28,.97),rgba(9,16,28,.86));border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.06em;color:var(--sodium);text-transform:uppercase;line-height:1}
#crumb{display:flex;align-items:center;gap:10px;min-width:0}
#crumb .where{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;display:flex;flex-direction:column;line-height:1}
#crumb .where small{font-family:var(--f-body);font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
#crumb .alt{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.when{display:flex;flex-direction:column;gap:3px;min-width:150px}
.when b{font-weight:600;font-size:13px}.when small{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.clock{height:3px;background:var(--line);border-radius:2px;overflow:hidden}#clockfill{height:100%;background:var(--sodium);width:0}
.speed{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.speed button{background:none;border:0;padding:5px 9px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.speed button.on{background:var(--sodium);color:var(--sodium-ink)}
.money{display:flex;gap:18px;margin-left:auto;align-items:flex-end}
.money div{display:flex;flex-direction:column}
.money small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.money b{font-family:var(--f-mono);font-weight:500;font-size:16px}
#cash.neg{color:var(--bad)}
.nav{display:flex;gap:6px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 11px;color:var(--paper)}
.ghost:hover{border-color:var(--muted)}
.sm{padding:3px 9px;font-size:12.5px}

/* panels */
.panel{position:fixed;z-index:20;top:var(--bar-h,62px);bottom:52px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;overscroll-behavior:contain;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
#left{left:16px;width:340px}
#right{right:16px;width:440px}
.pad{padding:16px 18px 20px;position:relative}
.close{position:absolute;right:12px;top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;min-width:0}
.kv.sm{font-size:12.5px;gap:3px 10px}
.kv small{color:var(--muted)}
.box{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:5px;padding:12px 14px;margin:14px 0}
.box.mine{border-color:rgba(242,169,59,.5)}
.box.rival{border-color:rgba(228,87,75,.45)}
.box.danger{border-color:rgba(239,106,94,.35)}
.box p:last-child{margin-bottom:0}
.price{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.price span{font-size:24px;color:var(--sodium)}.price small{color:var(--muted)}
.btn{background:var(--sodium);color:var(--sodium-ink);border:0;border-radius:4px;padding:8px 14px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn:disabled,.ghost:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.btn.wide{width:100%;margin-top:6px;padding:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.loc{margin:4px 0 6px}.lrow{display:flex;justify-content:space-between;margin-bottom:5px}.lrow span{color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#9a6a22,var(--sodium))}
.loc small{color:var(--muted);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:3px;padding:2px 7px;font-size:12px}.chip.dim{opacity:.45}.chip b{color:var(--bad);font-weight:500}
.intro{border-left:3px solid var(--sodium);padding:2px 0 2px 14px;margin-bottom:18px}
.chead,.crow{display:grid;grid-template-columns:1fr 62px 56px 58px;gap:6px;align-items:center}
.chead{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.chead span:not(:first-child),.crow .mono{text-align:right}
.crow{width:100%;background:none;border:0;border-bottom:1px solid rgba(40,53,79,.6);padding:8px;text-align:left;font-size:13px}
.crow:hover{background:rgba(242,169,59,.07)}
.cn{display:flex;flex-direction:column;min-width:0}.cn small{color:var(--muted);font-size:11px}.cn em{align-self:flex-start;font-style:normal;color:var(--sodium);font-family:var(--f-mono);font-size:11px}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;text-align:left}
.prow span:first-child{display:flex;flex-direction:column;min-width:0}.prow small{color:var(--muted);font-size:11.5px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px}
.tally span{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}.tally b{font-size:20px;color:var(--paper);font-weight:500}

/* site panel */
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 0}
.shead .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-family:var(--f-body);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:3px;border:1px solid currentColor;vertical-align:middle}
.pill.ok{color:var(--good)}.pill.set{color:var(--sodium)}.pill.off{color:var(--muted)}.pill.req{color:var(--sodium);margin-left:6px;font-size:9.5px}
.pill.d-easy{color:var(--good)}.pill.d-medium{color:var(--sodium)}.pill.d-hard{color:var(--bad)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 8px;color:var(--muted);font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--paper);border-bottom-color:var(--sodium)}
.checks{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:baseline}.checks li span{font-family:var(--f-mono);color:var(--muted);width:14px}.checks li.ok span{color:var(--good)}.checks li.ok .link,.checks li.ok{color:var(--muted)}
.checks.big li{padding:6px 0;border-bottom:1px solid var(--line)}.checks small{margin-left:auto;color:var(--muted)}
.stats,.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.stats div,.caps div{background:var(--panel2);border-radius:4px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.stats small,.caps small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats b{font-size:19px;font-weight:500}.caps b{font-size:16px;font-weight:500}
.stats span,.caps span{font-size:11.5px;color:var(--muted)}
.stars{color:var(--sodium);font-family:var(--f-body);letter-spacing:1px;font-size:15px!important;font-weight:400!important}
.tips{border-left:3px solid var(--sodium);padding-left:12px;margin:6px 0 10px;font-size:13px}.tips p{margin:0 0 6px}
.chart{width:100%;height:auto;display:block}.chart .ax{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.chartkey{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:4px 0 10px}.chartkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
.pl td{padding:4px 0;border-bottom:1px solid rgba(40,53,79,.55)}.pl td:last-child{text-align:right}.pl .tot td{border-bottom:0;padding-top:8px;font-weight:600}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stepper small{flex-basis:100%;color:var(--muted);font-size:12px}
.stepper.big .mono{font-size:22px;min-width:120px;text-align:center}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(40,53,79,.6)}
.item>div:first-child{display:flex;flex-direction:column;min-width:0}.item small{color:var(--muted);font-size:12px}
.ia{display:flex;align-items:center;gap:8px;flex-shrink:0}.own{color:var(--muted);font-size:12px;min-width:28px;text-align:right}
.dots{color:var(--sodium);letter-spacing:1px;margin-left:6px;font-size:10px}.dots i{color:var(--line);font-style:normal}
.sub{font-size:13px;margin:14px 0 2px;font-weight:600}.sub small{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 9px;font-size:12.5px;color:var(--muted)}.seg button.on{background:var(--sodium);color:var(--sodium-ink)}
.menu{display:grid;gap:10px;margin-bottom:12px}
.mi{background:var(--panel2);border-radius:5px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.mt{display:flex;flex-direction:column;min-width:0}.mt small{color:var(--muted);font-size:11.5px}
.mrow{display:flex;align-items:center;gap:6px}
.mrow input{width:86px;background:var(--night);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:5px 7px;text-align:right;font-size:14px}
.mi .kv{grid-column:1/-1;grid-template-columns:repeat(4,auto 1fr);margin:0}
.tog{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-weight:600}
.tog input{accent-color:var(--sodium);width:16px;height:16px}
.stock{font-size:12.5px}.stock th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
.stock td{padding:7px 4px;border-bottom:1px solid rgba(40,53,79,.55);vertical-align:middle}.stock td small{display:block;color:var(--muted);font-size:10.5px}
.stock td.ia{gap:4px}.stock .ghost.sm{padding:3px 6px;font-size:11.5px}

/* legend, ticker, toasts, labels */
#ibar{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:56px;width:min(600px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--sodium);border-radius:5px;padding:9px 12px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#ibar .ib-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#ibar .ib-h b{font-size:14px}#ibar .ib-h .mono{color:var(--muted);font-size:11.5px;flex:1}
#ibar .ib-hint{margin:6px 0 7px;font-size:12px;color:var(--muted)}#ibar .ib-hint b{color:var(--paper)}#ibar kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--paper)}
#ibar .ib-row{display:flex;gap:6px;flex-wrap:wrap}#ibar .ib-row button:not(.btn):not(.ghost){background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font-size:12px;color:var(--paper);display:flex;gap:6px;align-items:center}
#ibar .ib-row button b{color:var(--sodium);font-weight:500}#ibar .ib-row button:hover{border-color:var(--sodium)}
#legend{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:56px;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
#legend button{background:none;border:1px solid transparent;border-radius:3px;padding:3px 8px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#legend button.on{color:var(--paper);border-color:var(--line)}#legend i{width:10px;height:10px;border-radius:2px;display:inline-block;opacity:.35}#legend button.on i{opacity:1}
.lg-hint{font-size:11px;color:var(--muted);padding:0 6px}
#ticker{position:fixed;z-index:18;left:0;right:0;bottom:0;height:40px;padding:0 16px calc(env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:28px;overflow:hidden;white-space:nowrap;background:rgba(9,16,28,.92);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.tk b{font-family:var(--f-mono);font-weight:500;color:var(--sodium);margin-right:8px}.tk.warn{color:var(--paper)}.tk.good,.tk.goal{color:var(--good)}
#toasts{position:fixed;z-index:40;right:16px;top:calc(var(--bar-h,62px) + 4px);display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:9px 12px;font-size:13px;transition:opacity .4s,transform .4s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.good,.toast.goal{border-left-color:var(--good)}.toast.warn{border-left-color:var(--sodium)}.toast.out{opacity:0;transform:translateX(12px)}
#labels{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.clabel{position:absolute;left:0;top:0;will-change:transform}
.clabel button{pointer-events:auto;transform:translate(-50%,-50%);background:none;border:0;color:#fff;padding:1px 4px;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.55)}
.clabel.feat button{font-size:16px;transform:translate(-6px,-50%)}.clabel.feat button::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sodium);margin-right:6px;vertical-align:2px;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.clabel.small button{font-size:12px;font-weight:700;opacity:.92}
.clabel i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;color:var(--sodium-ink);background:var(--sodium);border-radius:2px;padding:0 3px;margin-left:5px;vertical-align:2px;text-shadow:none}
.clabel button:hover{color:var(--sodium)}
.clabel.lm button{font-size:11.5px;letter-spacing:.03em;text-transform:none;font-weight:700;background:rgba(18,22,30,.78);border-radius:3px;padding:3px 7px;transform:translate(-50%,-100%);text-shadow:none;border-left:3px solid var(--sodium)}
.clabel.lm small{display:block;font-family:var(--f-mono);font-weight:400;font-size:9.5px;opacity:.75;letter-spacing:0}

.clabel b{font-family:var(--f-mono);font-weight:500;color:var(--sodium);margin-left:5px;font-size:11px}


/* modals */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(5,9,16,.66);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{background:#111a2b;border:1px solid var(--line);border-radius:7px;width:min(1040px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mhead{padding:20px 22px 6px}.mbody{padding:6px 22px 14px;overflow:auto;min-height:0}.mfoot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.mbody p{max-width:68ch}
.fld{display:flex;flex-direction:column;gap:5px;margin:14px 0 6px;max-width:420px}.fld span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.fld input{background:var(--night);border:1px solid var(--line);border-radius:4px;color:var(--paper);padding:9px 11px;font-size:15px}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.bcard:hover:not(:disabled){border-color:var(--muted)}.bcard.on{border-color:var(--sodium);box-shadow:inset 0 0 0 1px var(--sodium)}
.bcard:disabled{opacity:.5;cursor:not-allowed}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px}.bt b{font-family:var(--f-display);font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.bcard>p{font-size:12.5px;color:var(--muted);margin:0}
.pc ul{list-style:none;padding:0;margin:0;font-size:12px;display:flex;flex-direction:column;gap:3px}
.pc .pros li::before{content:'+ ';color:var(--good);font-family:var(--f-mono)}.pc .cons{margin-top:6px}.pc .cons li::before{content:'− ';color:var(--bad);font-family:var(--f-mono)}
.confirm{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted);margin-top:8px}.sum b{color:var(--paper);margin-left:6px}
.tscroll{overflow-x:auto}
.mkt td,.mkt th{padding:6px 8px;border-bottom:1px solid rgba(40,53,79,.6);text-align:left;font-size:13px}.mkt th{font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}.mkt td small{display:block;color:var(--muted);font-size:11px}
.spark{width:110px;height:26px;display:block}
.news{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}.news b{color:var(--sodium);font-weight:500;margin-right:6px}

@media (max-width:860px){
 #bar{gap:6px 12px;padding-left:12px;padding-right:12px}
 .brand{font-size:20px}.when{min-width:0}.money{margin-left:0;gap:12px}.money b{font-size:14px}
 .panel{left:8px!important;right:8px!important;width:auto!important;top:auto;bottom:48px;max-height:46%}
 #legend{bottom:auto;top:calc(var(--bar-h,90px) + 2px)}.lg-hint{display:none}
 .mi .kv{grid-template-columns:auto 1fr auto 1fr}
 .grid2{grid-template-columns:1fr}
 #toasts{top:auto;bottom:52px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.pill.real{color:var(--teal);display:inline-block;margin:-4px 0 12px}
.shbtn{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}
.cn em{align-self:flex-start;font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--teal);border:1px solid rgba(63,176,191,.5);border-radius:2px;padding:0 3px;margin-left:4px}
.chead,.crow{grid-template-columns:1fr 70px 62px}
#loading{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading b{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,8vw,72px);color:var(--sodium);letter-spacing:.04em;text-transform:uppercase;line-height:1}
#loading p{color:var(--muted);margin:0}
#loading .bar2{width:180px;height:3px;background:var(--line);overflow:hidden;border-radius:2px}#loading .bar2 i{display:block;height:100%;width:40%;background:var(--sodium);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#loading .bar2 i{animation:none}}

/* simplified top bar */
#bar{flex-wrap:nowrap;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 7px) 14px 7px}
.brand{font-size:21px;flex-shrink:0}
#crumb .where{font-size:16px;white-space:nowrap}#crumb .where small{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcenter{display:flex;align-items:center;gap:12px;margin:0 auto}
.clockbox{display:flex;flex-direction:column;gap:4px;min-width:118px}.clockbox b{font-weight:600;font-size:13px;white-space:nowrap}
#goalchip{flex-shrink:1;min-width:0;background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.45);color:var(--paper);border-radius:999px;padding:4px 11px;font-size:12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goalchip b{color:var(--sodium);font-weight:600;margin-right:5px}
.money{display:flex;flex-direction:column;align-items:flex-end;gap:1px;margin-left:0}
.money b{font-size:17px}.money small{font-size:11px;letter-spacing:0;text-transform:none;white-space:nowrap}#shopsbtn{white-space:nowrap}
.icon{font-size:15px;padding:4px 10px}
.dropdown{position:fixed;z-index:35;right:14px;top:calc(var(--bar-h,56px) - 4px);width:300px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.dropdown button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-radius:4px;padding:8px 10px;text-align:left;gap:10px}
.dropdown button:hover{background:var(--panel2)}.dropdown small{display:block;color:var(--muted);font-size:11.5px}
#mapctl{position:fixed;z-index:19;right:16px;bottom:56px;display:flex;flex-direction:column;gap:6px}
#mapctl button{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-family:var(--f-mono);font-size:14px;display:grid;place-items:center}
#mapctl button:hover{border-color:var(--sodium)}
#hint{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:100px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sodium);border-radius:5px;padding:9px 14px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
#ibar .ib-main{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}#ibar .ib-t{font-size:14px}#ibar .ib-k{font-size:12px;color:var(--muted)}#ibar .warnc{color:var(--sodium);font-weight:600}
.sitem{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.sitem .st{font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}.sitem .st.warnc{color:var(--sodium)}

@media (max-width:980px){.brand,#goalchip{display:none}}
@media (max-width:700px){#crumb{display:none}.clockbox{min-width:84px}}
.evc{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.evbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left}
.evbtn:hover:not(:disabled){border-color:var(--sodium)}.evbtn:disabled{opacity:.45;cursor:not-allowed}.evbtn .mono{color:var(--sodium)}
.wk{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}.wkrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.wkrow small{display:block;color:var(--muted)}.wkrow>.mono{color:var(--sodium)}.wkrow .meter{grid-column:1/-1}.wkrow.ok{border-color:rgba(120,207,152,.5)}.wkrow.ok>.mono{color:var(--good)}

/* ===== ANCAP LIFE theme: flat black and flag-yellow, chunky game UI ===== */
:root{--night:#0a0a0a;--panel:#111111;--panel2:#1b1b1b;--line:#2c2c2c;--paper:#f6f4ec;--muted:#a19e92;--sodium:#ffde00;--sodium-ink:#0a0a0a;--teal:#ffde00;--good:#7be08f;--bad:#ff5d4d;
 --r:9px}
body{font-family:var(--f-body)}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:500}
.flag{display:inline-block;width:26px;height:18px;border-radius:3px;background:linear-gradient(146deg,var(--sodium) 50%,#000 50%);border:2px solid #000;box-shadow:0 0 0 1px var(--sodium);margin-right:10px;vertical-align:-2px}
.flag.big{width:96px;height:64px;border-radius:6px;margin:0 0 6px}
#bar{background:#0a0a0a;border-bottom:3px solid var(--sodium);padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px}
.brand{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.04em;color:var(--sodium);line-height:1;display:flex;align-items:center}
#crumb .where{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em}
#crumb .where small{font-family:var(--f-body);font-weight:600;letter-spacing:.06em}
.clockbox b{font-weight:700}.clock{height:5px;border-radius:3px;background:#262626}#clockfill{background:var(--sodium)}
.speed{border:0;gap:4px;background:none}.speed button{background:#1d1d1d;border-radius:6px;font-family:var(--f-body);font-weight:700;padding:6px 10px;color:var(--paper)}
.speed button.on{background:var(--sodium);color:#000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.money b{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.02em;color:var(--sodium);line-height:.9}
.money small{font-weight:600}
#goalchip{background:var(--sodium);border:0;color:#000;font-weight:600;border-radius:999px;padding:6px 14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}#goalchip b{color:#000;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.06em;margin-right:8px}
.btn{background:var(--sodium);color:#000;border-radius:var(--r);padding:9px 16px;font-family:var(--f-body);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:13px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);transition:transform .06s,filter .1s}
.btn:hover:not(:disabled){filter:brightness(1.08)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}.btn:disabled{background:#3a3a3a;color:#7a7a72;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px}

#legend,#ibar,#hint,.dropdown{background:rgba(12,12,12,.96);border:2px solid #000;border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 1px #262626}

.evwrap{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}

.portrait svg{width:100%;height:100%;display:block}.portrait .nm{position:absolute;left:0;right:0;bottom:0;background:#000;color:var(--sodium);font-family:var(--f-display);font-size:20px;letter-spacing:.04em;padding:5px 10px}

.evbtn:hover:not(:disabled){border-color:var(--sodium);background:#1f1c08}.evbtn b{font-size:15px}.evbtn .hint{grid-column:1/-1;color:var(--muted);font-size:12.5px}

/* tutorial */

@keyframes tpulse{50%{box-shadow:0 0 0 9999px rgba(0,0,0,.42),0 0 36px rgba(255,222,0,.95)}}
.tut-arrow{position:fixed;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid var(--sodium);filter:drop-shadow(0 3px 0 #000);transition:all .25s ease;animation:tbob .8s ease-in-out infinite}
@keyframes tbob{50%{margin-top:6px}}
.tut-card{position:fixed;width:min(340px,calc(100% - 32px));background:#0f0f0f;border:3px solid var(--sodium);border-radius:14px;padding:14px 16px;pointer-events:auto;box-shadow:0 10px 0 rgba(0,0,0,.45);transition:all .25s ease}

.tut-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tut-card .skip{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}

[hidden]{display:none!important}
.deltas .up{color:var(--good)}.deltas .down{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.tut-ring,.tut-arrow{animation:none}}

/* ===== ANCAP LIFE · "Commodity Exchange Ledger" =====
   Brutalist trading-floor paperwork: pure black, one hazard yellow, square corners,
   hairline rules instead of boxes, tabular mono for every number.
   Display: Big Shoulders Display · Text: Archivo · Figures: IBM Plex Mono */
:root{--night:#000;--panel:#0b0b0b;--panel2:#141414;--line:#303030;--rule:#3d3d3d;--paper:#f2efe4;--muted:#9a978a;
 --sodium:#ffd800;--sodium-ink:#000;--teal:#ffd800;--good:#6fd48a;--bad:#ff5a47;
 --f-display:'Big Shoulders Display','Oswald','Impact',sans-serif;
 --f-body:'Archivo','Helvetica Neue',sans-serif;
 --f-mono:'IBM Plex Mono','Courier New',monospace}
*,*::before,*::after{border-radius:0!important}
.sw,.coin,.fr-acct .av,.fr-meta .dot,.nx .nn{border-radius:50%!important}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;font-feature-settings:"tnum" 1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:500}
/* kill every soft effect */
.panel,.modal,.dropdown,#ibar,#legend,#hint,.toast,.tut-card,.portrait,#skipov,.fr-card,.btn,.ghost,.speed button,.evbtn,.bcard,#mapctl button,.deltas span,.fr-play,.cfx{box-shadow:none!important;text-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.fr-glow{display:none}
/* type */
.h{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.92;letter-spacing:.01em;text-transform:uppercase;margin:0 0 12px}
.display{font-family:var(--f-display);font-weight:900;color:var(--sodium)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;padding-top:8px;border-top:1px solid var(--rule)}
.eyebrow:first-child{padding-top:0;border-top:0}
.next .eyebrow,.tut-card .eyebrow{color:var(--sodium);border-top:0;padding-top:0}
/* top bar: one hard line, brand as a stamped plate */
#bar{background:#000;border-bottom:2px solid var(--sodium);gap:18px}
.brand{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.07em;background:var(--sodium);color:#000;padding:5px 10px 3px 8px}

.clock{height:2px;background:var(--line)}#clockfill{background:var(--sodium)}
.speed{gap:0;border:1px solid var(--rule)}

#moneybox{background:none;box-shadow:none!important;border-left:1px solid var(--rule);padding:0 0 0 14px}

.meter{height:5px;background:#262626}.meter i{background:var(--sodium)!important}
.stars{color:var(--sodium)}

/* choice cards (buildings, items) keep a frame because they are selectable */
.bcard{background:#0b0b0b;border:1px solid var(--rule)}
.bcard:hover:not(:disabled){border-color:var(--paper)}
.bcard.on{background:#16140a;border:1px solid var(--sodium);border-left:6px solid var(--sodium);box-shadow:none}
.bt b{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.02em}
.seg{border:1px solid var(--rule)}.seg button.on{background:var(--sodium);color:#000}
.fld input,.mrow input,.renrow input,.au-f input,#frname{background:#000;border:1px solid var(--rule);border-bottom:2px solid #6a6a60;color:var(--paper);font-family:var(--f-body);padding:10px 11px}

.fld span,.fr-lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
/* modals: a hazard-tag top rule */
.modal-back{background:rgba(0,0,0,.84)}
.modal{background:#0b0b0b;border:1px solid var(--rule);border-top:8px solid var(--sodium)}
.mhead{padding:18px 24px 6px}.mfoot{border-top:1px solid var(--rule)}

#ticker{background:#000;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:11.5px;height:34px}
.tk b{font-family:var(--f-mono);font-weight:600;color:var(--sodium)}
.toast{background:#0b0b0b;border:1px solid var(--rule);border-left:4px solid var(--sodium);font-weight:500}

.dropdown button:hover{background:var(--sodium);color:#000}.dropdown button:hover small{color:#000}
.clabel button{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.06em;
 text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000,-1px -1px #000,1px 1px #000,-1px 1px #000,1px -1px #000!important}

.fr-hero{text-align:left;max-width:440px;margin:0 0 26px;font-size:16px;line-height:1.5;color:var(--paper);text-shadow:none;border-left:4px solid var(--sodium);padding-left:14px}

#front .fr-card{max-width:440px;background:#000;border:1px solid var(--rule);border-top:8px solid var(--sodium);box-shadow:none}

.fr-top{padding:14px 22px 0}
.fr-tag{background:none;border:1px solid var(--sodium);color:var(--sodium);font-family:var(--f-mono);font-weight:500;font-size:10px;padding:4px 7px}
.fr-who{font-family:var(--f-mono);font-size:10px}
.fr-card h1{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:.9;text-transform:uppercase;letter-spacing:0;margin:14px 22px 8px}
.fr-sub{color:var(--muted);font-size:14px}
.fr-cities{gap:0;margin:0 0 18px;border:1px solid var(--rule)}
.fr-cities span{background:none;font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.14em;border-right:1px solid var(--rule);padding:6px 9px;color:var(--paper)}
.fr-cities span:last-child{border-right:0;color:var(--sodium)}
.fr-feat{counter-reset:f;gap:0;margin:0 0 20px;border-top:1px solid var(--rule)}

.fr-feat i{font-size:0;margin:0;width:26px;flex:none}
.fr-feat i::before{content:counter(f,decimal-leading-zero);font:500 12px var(--f-mono);color:var(--sodium)}
.fr-feat b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.fr-feat small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;line-height:1.4}
.fr-play{background:var(--sodium);color:#000;border:2px solid var(--sodium);font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.1em;padding:10px;box-shadow:none}
.fr-play:hover{filter:none;background:#fff;border-color:#fff}.fr-play:active{transform:none;background:#000;color:var(--sodium)}
.fr-ghost{border:1px solid #555;font-family:var(--f-mono);font-weight:500;color:var(--paper)}
.fr-acct{background:none;border:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0}
.fr-acct .av{background:var(--sodium);font-family:var(--f-display);border-radius:0!important}
.fr-acct button{border:1px solid #555;color:var(--paper)}
.au-tabs{border-bottom:1px solid var(--rule)}.au-tabs button{font-family:var(--f-mono);font-weight:500}
.au-chk input{accent-color:var(--sodium)}
.fr-lbh,.fr-meta{font-family:var(--f-mono)}
.fr-lb{border-top:1px solid var(--rule)}
#front .fr-foot{text-shadow:none;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:22px}
@media (max-width:700px){#front .fr-wrap{padding:28px 18px}#front .fr-logo{font-size:clamp(56px,19vw,96px)}.fr-shade{background:rgba(0,0,0,.78)}}

<script>
// ===================== ANCAP LIFE · GEOGRAPHY (no DOM, no THREE) =====================
const R_E=6371000,D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hash2(i,j,s){let h=Math.imul(i|0,0x27d4eb2d)^Math.imul(j|0,0x165667b1)^Math.imul(s|0,0x9e3779b1);h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;return(h>>>0)/4294967296}
function distM(la1,lo1,la2,lo2){const x=(lo2-lo1)*D2R*Math.cos((la1+la2)/2*D2R),y=(la2-la1)*D2R;return Math.hypot(x,y)*R_E}

const TPACK={};function tpackOf(p){let h=0;for(const c of p)h=(h+c.charCodeAt(0))%8;return h}
let LOADER=async p=>{if(typeof window!=='undefined'&&window.__PACKED&&/^data\/tiles\/d.*\.json$/.test(p)){const b=tpackOf(p);if(!TPACK[b])TPACK[b]=fetch('data/tp'+b+'.json').then(r=>r.json());const P=await TPACK[b];return P[p]}const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json()};
function setLoader(f){LOADER=f}

// ---------- flat-array polygons ----------
function decFlat(f,q){const o=new Float64Array(f.length);let x=0,y=0;for(let i=0;i<f.length;i+=2){x+=f[i];y+=f[i+1];o[i]=x/q;o[i+1]=y/q}return o}
function bboxOf(r){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let i=0;i<r.length;i+=2){const x=r[i],y=r[i+1];if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}return[a,b,c,d]}
function pip(r,x,y){let c=false;for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const yi=r[i+1],yj=r[j+1];if((yi>y)!==(yj>y)&&x<(r[j]-r[i])*(y-yi)/(yj-yi)+r[i])c=!c}return c}
function mkPoly(rings,q){const rs=rings.map(r=>decFlat(r,q)).filter(r=>r.length>=6);return rs.length?{rs,bb:bboxOf(rs[0])}:null}
function inPoly(p,x,y){if(x<p.bb[0]||x>p.bb[2]||y<p.bb[1]||y>p.bb[3]||!pip(p.rs[0],x,y))return false;for(let k=1;k<p.rs.length;k++)if(pip(p.rs[k],x,y))return false;return true}
function ringArea(r){let a=0;for(let i=0,j=r.length-2;i<r.length;j=i,i+=2)a+=r[j]*r[i+1]-r[i]*r[j+1];return a/2}

// ---------- world ----------
const WORLD={ready:false,countries:[],places:[],raw:null};
async function loadWorld(){
 const w=await LOADER('data/world.json');WORLD.raw=w;
 WORLD.countries=w.countries.map(c=>({n:c.n,iso:c.iso,cont:c.cont,sub:c.sub,gdppc:c.gdppc,polys:c.g.map(p=>mkPoly(p,100)).filter(Boolean)}));
 WORLD.places=w.places.map(p=>({name:p[0],lat:p[1],lon:p[2],pop:p[3],iso:p[4],world:p[5]}));
 WORLD.towns=(w.towns||[]).map(p=>({name:p[0],lat:p[1],lon:p[2],pop:p[3],iso:p[4]}));
 WORLD.sgrid=new Map();for(const p of WORLD.places.concat(WORLD.towns)){const k=Math.floor(p.lat)+','+Math.floor(p.lon);let a=WORLD.sgrid.get(k);if(!a)WORLD.sgrid.set(k,a=[]);a.push(p)}
 WORLD.tileIndex=new Set(await LOADER('data/tiles/index.json'));
 WORLD.ready=true;
}
function countryAt(lat,lon){
 for(const c of WORLD.countries)for(const p of c.polys)if(inPoly(p,lon,lat))return c;
 let best=null,bd=1e18;for(const c of WORLD.countries)for(const p of c.polys){if(lon<p.bb[0]-3||lon>p.bb[2]+3||lat<p.bb[1]-3||lat>p.bb[3]+3)continue;const r=p.rs[0];for(let i=0;i<r.length;i+=2){const d=(r[i]-lon)**2+(r[i+1]-lat)**2;if(d<bd){bd=d;best=c}}}return best;
}
function placeNear(lat,lon,maxKm){
 let best=null,bs=-1;
 for(const p of WORLD.places){if(Math.abs(p.lat-lat)>1.2)continue;const d=distM(lat,lon,p.lat,p.lon)/1000;if(d>(maxKm||80))continue;const s=p.pop*Math.exp(-d/12);if(s>bs){bs=s;best=Object.assign({d},p)}}
 return best;
}
function nearestPlace(lat,lon){let best=null,bd=1e9;for(const p of WORLD.places){if(Math.abs(p.lat-lat)>2)continue;const d=distM(lat,lon,p.lat,p.lon);if(d<bd){bd=d;best=p}}return best?Object.assign({d:bd/1000},best):null}

// big urban parks that procedural blocks must leave open
const PARKZ=[[[40.7681,-73.9819],[40.8003,-73.9581],[40.7968,-73.9493],[40.7644,-73.9730]],[[51.5115,-0.1880],[51.5112,-0.1520],[51.5030,-0.1520],[51.5030,-0.1880]],[[48.8650,2.2400],[48.8780,2.2700],[48.8470,2.2700],[48.8470,2.2400]]];
function inParkZ(lat,lon){for(const P of PARKZ){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[0]>lat)!==(b[0]>lat)&&lon<(b[1]-a[1])*(lat-a[0])/(b[0]-a[0])+a[1])c=!c}if(c)return true}return false}
function hdCore(lat,lon){let m=0;for(const z of HD){if(Math.abs(z[0]-lat)>.06)continue;const d=distM(lat,lon,z[0],z[1]),k=z[3]*Math.exp(-((d/z[2])**2)*1.4);if(k>m)m=k}return m}
// how built-up a spot is: 0 (edge of town) .. 1 (downtown of a megacity)
function coreness(lat,lon){
 let m=hdCore(lat,lon);for(const p of WORLD.places){if(Math.abs(p.lat-lat)>.6||p.pop<150000)continue;const d=distM(lat,lon,p.lat,p.lon);const r=650*Math.pow(p.pop/1e6,.36)+350;const k=Math.pow(Math.min(1,p.pop/1.2e7),.45)*Math.exp(-((d/r)**2));if(k>m)m=k}return m;
}

// ---------- detail tiles (20°) ----------
const TILES={};
function tileKey(lat,lon){return Math.min(17,Math.floor((lon+180)/20))+'_'+Math.min(8,Math.floor((lat+90)/20))}
function tileReady(lat,lon){const k=tileKey(lat,lon);return !WORLD.tileIndex.has(k)||(TILES[k]&&TILES[k].ready)}
function ensureTile(k){
 if(TILES[k])return TILES[k].p;
 const T=TILES[k]={ready:false};
 if(!WORLD.tileIndex.has(k)){T.ready=true;T.land=[];T.lakes=[];T.urban=[];T.rivers=[];T.roads=[];T.p=Promise.resolve(T);return T.p}
 T.p=LOADER('data/tiles/d'+k+'.json').then(d=>{
  T.land=d.land?d.land.map(p=>mkPoly(p,1e4)).filter(Boolean):[];
  T.lakes=d.lakes?d.lakes.map(p=>mkPoly(p,1e4)).filter(Boolean):[];
  T.urban=d.urban?d.urban.map(p=>mkPoly(p,1e4)).filter(Boolean):[];
  T.rivers=(d.rivers||[]).map(([k,f])=>{const r=decFlat(f,1e4);return{k,r,bb:bboxOf(r)}});
  T.roads=(d.roads||[]).map(([k,f])=>{const r=decFlat(f,1e4);return{k,r,bb:bboxOf(r)}});
  T.ready=true;return T});
 return T.p;
}
function ensureTilesAround(lat,lon,deg){const ks=new Set();for(const dy of[-deg,0,deg])for(const dx of[-deg,0,deg])ks.add(tileKey(clamp(lat+dy,-89,89),((lon+dx+540)%360)-180));return Promise.all([...ks].map(ensureTile))}
function tileOf(lat,lon){const T=TILES[tileKey(lat,lon)];return T&&T.ready?T:null}
function isLand(lat,lon){const T=tileOf(lat,lon);if(!T)return true;let land=false;for(const p of T.land)if(inPoly(p,lon,lat)){land=true;break}if(!land)return false;for(const p of T.lakes)if(inPoly(p,lon,lat))return false;return true}
function isUrban(lat,lon){const T=tileOf(lat,lon);if(!T)return false;for(const p of T.urban)if(inPoly(p,lon,lat))return true;return false}

// building themes by country and region
function styleFor(iso,cont,sub){

 if(s.ownerRole==='back'||s.ownerRole==='front')st[s.ownerRole]+=b.ownerCap[s.ownerRole]*eff;
 const back=Math.min(eq.back,st.back),front=Math.min(eq.front,st.front),perH=Math.min(front,back/b.backLoad);

function simSite(s,dow){
 const b=BIZ[s.type],lot=siteLot(s),E=s.p,caps=siteCaps(s);
 const d={day:G.day,rev:0,cogs:0,wages:0,rent:0,util:0,fees:0,mkt:0,waste:0,cust:0,lost:0,sold:{},stockout:0,open:s.status==='open'};
 for(const x of s.staff)d.wages+=x.wage*Math.min(s.hours,8);
 if(s.tenure==='lease')d.rent=s.rent/30;
 const sq=Math.sqrt(E.price),sqm=lot?lot.sqm:60;
 if(typeof invDayStart==='function')invDayStart(s);
 const shut=s.shutUntil!=null&&G.day<=s.shutUntil;
 if(s.status==='open'&&lot&&!shut){
  s._comp=competition(s);
  if(s.auto)restock(s,s.days);
  const want=visitorsH(s,{caps,noise:(G.wx[s.id]||1)*rnd(.92,1.08),dow})*effHours(s.hours),cap=caps.perH*s.hours,served=Math.min(want,cap);
  d.cust=Math.round(served);d.lost=Math.max(0,Math.round(want-served));let wU=0,sU=0;const dem={};
  for(const p of b.products){const pr=s.prices[p.id],u=Math.round(d.cust*takeRate(b,p,E,pr));wU+=u;let mk=u;
   for(const k in p.rec){const h=s.inv[k]?s.inv[k].q:0;mk=Math.min(mk,Math.floor(h/p.rec[k]+1e-9));dem[k]=(dem[k]||0)+u*p.rec[k]}
   mk=Math.max(0,mk);for(const k in p.rec){if(!mk)break;const inv=s.inv[k],qq=mk*p.rec[k];if(typeof invSell==='function')invSell(s,k,qq,inv);inv.q=Math.max(0,inv.q-qq);d.cogs+=qq*inv.c}
   d.sold[p.id]=mk;sU+=mk;d.rev+=mk*pr}
  d.stockout=wU?1-sU/wU:0;
  for(const k of bizSupplies(b)){const v=dem[k]||0;s.use[k]=s.use[k]==null?v:s.use[k]*.6+v*.4}
  d.util=sqm*b.util*sq;d.fees=d.rev*.028+5*E.price;d.mkt=s.mkt;
  const target=clamp(caps.quality+clamp((1-priceRatio(s))*45,-35,12)-d.stockout*60-(want>0?d.lost/want:0)*35,0,100);s.rep+=(target-s.rep)*.07;
 }else d.util=sqm*b.util*.25*sq;
 for(const k in s.inv){const S=SUP[k],inv=s.inv[k];if(!S.shelf||inv.q<=0)continue;const per=Math.max(s.use[k]||0,.0001),keep=per*S.shelf*(caps.fridge?1:.6);
  let lost=Math.max(0,inv.q-keep)*.5+inv.q*(S.shelf<=14?(caps.fridge?.012:.04):.002);if(caps.mgr)lost*=.7;if(lvFx(s).store)lost*=.7;lost=Math.min(lost,inv.q);inv.q-=lost;d.waste+=lost*inv.c}
 d.profit=d.rev-d.cogs-d.wages-d.rent-d.util-d.fees-d.mkt-d.waste;
 G.cash+=d.rev-d.wages-d.rent-d.util-d.fees-d.mkt;
 s.hist.push(d);if(s.hist.length>90)s.hist.shift();s.last=d;return d;
}
// ---------- world ----------
const UP_NEWS=['{n} prices jump {p}% after supply disruption','Shipping delays push {n} up {p}%','Poor harvest lifts {n} prices {p}%','Strong demand drives {n} up {p}%'];
const DN_NEWS=['Glut sends {n} prices down {p}%','{n} fall {p}% as a new supplier enters the market','Cheaper freight cuts {n} prices {p}%'];
function marketStep(){
 for(const k in G.mkt){const m=G.mkt[k],S=SUP[k],pr=m.pressure?Math.min(.015,m.pressure/250000):0;m.pressure=0;m.m=clamp(m.m+(1-m.m)*.025+gauss()*S.vol+pr,.5,2.2);m.h.push(+m.m.toFixed(4));if(m.h.length>60)m.h.shift()}
 if(Math.random()<.07){const ks=Object.keys(SUP),k=ks[Math.floor(Math.random()*ks.length)],up=Math.random()<.55,p=Math.round(rnd(10,28)),L=up?UP_NEWS:DN_NEWS;G.mkt[k].m=clamp(G.mkt[k].m*(up?1+p/100:1-p/100),.5,2.2);const t=L[Math.floor(Math.random()*L.length)].replace('{n}',SUP[k].n).replace('{p}',p);news(t.charAt(0).toUpperCase()+t.slice(1),'market')}
}
function propValue(p){const lot=lotByKey(p.key);if(!lot)return p.price||0;const E=econAt(lot.lat,lot.lon);return(p.floors>0?bldgValue(E,lot,p.floors):plotValue(E,lot))*(1+.03*(G.day-p.day)/365)}
function propIncome(p){
 const lot=lotByKey(p.key);if(!lot)return{inc:0,cost:0};const E=econAt(lot.lat,lot.lon);
 if(p.build&&!p.built)return{inc:0,cost:propValue(p)*.004/365};
 let inc=0;if(p.floors>0){inc+=upperRent(E,lot,p.floors)/30*.92;if(p.ground==='tenant')inc+=groundRent(E,lot)/30*.9}
 return{inc,cost:propValue(p)*.007/365};
}
function loanPayment(P,apr,days){const r=apr/365;return P*r/(1-Math.pow(1+r,-days))}
function addLoan(kind,P,apr,days,desc){const l={id:'l'+(G.seq++),kind,bal:P,apr,pay:loanPayment(P,apr,days),desc,day:G.day};G.loans.push(l);return l}
function loanLimit(){const prof=G.sites.reduce((a,s)=>a+s.hist.slice(-30).reduce((x,h)=>x+h.profit,0),0);const eq=G.props.reduce((a,p)=>a+propValue(p),0)-G.loans.filter(l=>l.kind==='mortgage').reduce((a,l)=>a+l.bal,0);
 return Math.max(0,Math.round((15000+Math.max(0,prof)*5+Math.max(0,eq)*.35-G.loans.filter(l=>l.kind==='business').reduce((a,l)=>a+l.bal,0))/1000)*1000)}
function rivalsStep(){
 for(const s of G.sites){const me=siteLot(s);if(!me)continue;const near=lotsNear(me,450);if(!near.length)continue;
  if(Math.random()<.035){const L=near[Math.floor(Math.random()*near.length)],st=lotState(L);if(st.st==='rival'){setLotState(L,{st:'lease'});if(BIZ[st.t])news(`${st.name||'A rival '+BIZ[st.t].n.toLowerCase()} on ${L.street} has closed down`,'city')}}
  if(Math.random()<.035){const L=near[Math.floor(Math.random()*near.length)],st=lotState(L);if(st.st==='lease'){const ty=Math.random()<.5?s.type:BIZ_IDS[Math.floor(Math.random()*BIZ_IDS.length)];setLotState(L,{st:'rival',t:ty,pi:rnd(.9,1.12),rep:rnd(30,70)});if(ty===s.type)news(`New competitor: a ${BIZ[ty].n.toLowerCase()} opened on ${L.street}, near ${s.name}`,'warn')}}
  if(s.status==='open'){const pr=priceRatio(s);for(const L of near){const st=lotState(L);if(st.st!=='rival'||st.t!==s.type||distM(L.lat,L.lon,me.lat,me.lon)>320)continue;const n=Object.assign({},st);if(pr<n.pi-.08)n.pi=Math.max(.8,n.pi-.008);else if(pr>n.pi+.1)n.pi=Math.min(1.25,n.pi+.004);n.rep=clamp(n.rep+gauss()*.6,15,95);setLotState(L,n)}}
 }
}
function netWorth(){let v=G.cash;for(const s of G.sites){v+=s.paid*.4+s.deposit;for(const k in s.inv)v+=s.inv[k].q*s.inv[k].c*.8}for(const p of G.props)v+=propValue(p);for(const l of G.loans)v-=l.bal;return v}

 while(LBL.length<lblCand.length){const d=document.createElement('div');d.className='clabel';labelsEl.appendChild(d);LBL.push({d,key:''})}
 const w=window.innerWidth,h=window.innerHeight,cp=camera.position,placed=[];
 for(let i=0;i<LBL.length;i++){const L=LBL[i],c=lblCand[i];
  if(!c){L.d.style.display='none';continue}
  const key=c.name+(c.n||'')+(c.small?'s':'');if(L.key!==key){L.key=key;L.d.className='clabel'+(c.small?' small':'')+(c.feat?' feat':'')+(c.lm?' lm':'');L.d.innerHTML=c.lm?`<button data-act="flylm" data-id="${c.lm.id}">${esc(c.name)}<small>${c.lm.yr} · ${c.lm.h} m</small></button>`:`<button data-act="flyll" data-lat="${c.lat}" data-lon="${c.lon}" data-real="${c.real?1:0}">${esc(c.name)}${c.real?'<i>3D</i>':''}${c.n?`<b>${c.n}</b>`:''}</button>`}
  const p=ecef(c.lat,c.lon,c.h||3000),n=p.clone().normalize(),facing=n.dot(cp.clone().sub(p).normalize());
  if(facing<.05){L.d.style.display='none';continue}
  const s=p.sub(ORIGIN).project(camera);if(s.z>1||Math.abs(s.x)>1.05||Math.abs(s.y)>1.05){L.d.style.display='none';continue}
  const px=(s.x*.5+.5)*w,py=(-s.y*.5+.5)*h;if(placed.some(q=>Math.abs(q[0]-px)<(c.feat?90:110)&&Math.abs(q[1]-py)<22)){L.d.style.display='none';continue}placed.push([px,py]);

}

<script>

// market swings, rival corporations) → REINVEST (corporate departments, IPO). Ranks take you from hustler to CEO and beyond.
(function(){
const CX_RANKS=[
 {t:'Hustler',nw:0,max:2,un:'Lease your first shops'},
 {t:'Shopkeeper',nw:75e3,max:3,un:'B2B contracts from local clients'},
 {t:'Owner-Operator',nw:2e5,max:5,un:'Furniture factories · bigger contracts'},
 {t:'Entrepreneur',nw:6e5,max:8,un:'Found your corporation · AI data centres'},

const CX_MARKETS=[
 {id:'calm',n:'Calm markets',d:'Business as usual.',m:{}},
 {id:'foodboom',n:'Foodie boom',d:'Everyone is eating out. Food businesses +25%.',m:{food:1.25}},
 {id:'techhype',n:'Tech hype cycle',d:'Gadgets and compute are hot. Tech +30%, data centres +20%.',m:{tech:1.3,datacenter:1.2}},
 {id:'recession',n:'Recession',d:'Belts tighten. All demand −15%, but staff are cheaper to keep.',m:{all:.85}},
 {id:'tourist',n:'Tourist season',d:'Visitors flood the cities. Retail and food +15%.',m:{retail:1.15,food:1.15,grocery:1.1}},
 {id:'energy',n:'Energy crisis',d:'Power is scarce. Data centres −25%, factories −10%.',m:{datacenter:.75,factory:.9}},
 {id:'harvest',n:'Bumper harvest',d:'Farms flood the market. Farms −20%, groceries +10%.',m:{farm:.8,grocery:1.1}},
 {id:'build',n:'Housing boom',d:'Everyone is furnishing new homes. Factories +35%.',m:{factory:1.35}},
 {id:'fashion',n:'Fashion week',d:'Style is everything. Boutiques +40%.',m:{retail:1.4}}];
const CX_CLIENTS={
 local:[['Corner Café Collective','#7be08f'],['St. Mary\'s School','#7be08f'],['Riverside Hotel','#7be08f'],['Village Fête Committee','#7be08f'],['Harbour Gym','#7be08f']],
 corp:[['Hargreave Logistics','#5fb0ff'],['Northwind Airlines','#5fb0ff'],['Omnicore Group','#5fb0ff'],['Brightline Rail','#5fb0ff'],['Vantage Hospitals','#5fb0ff']],
 gov:[['City Council','#c9a0ff'],['Ministry of Defence','#c9a0ff'],['National Health Trust','#c9a0ff'],['Olympic Committee','#c9a0ff']],

const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],rnd2=(a,b)=>a+R()*(b-a);
const fmt=v=>big(v);

function cx(){if(!G)return null;if(!G.cx)G.cx={rank:0,heat:8,contracts:[],offers:[],done:0,failed:0,corp:null,dept:{mkt:0,rnd:0,logi:0,legal:0,fin:0,hr:0},market:{id:'calm',until:7},rivals:CX_RIVALS.map((r,i)=>({n:r.n,c:r.c,nw:3e5*(1+i*.7),g:rnd2(.004,.009)})),ipo:null,brief:null,seen:0,log:[]};
 const C=G.cx;if(!C.dept)C.dept={mkt:0,rnd:0,logi:0,legal:0,fin:0,hr:0};return C}

function rankIdx(nw){let r=0;for(let i=0;i<CX_RANKS.length;i++)if(nw>=CX_RANKS[i].nw)r=i;return r}

function rankName(i,nw){const r=CX_RANKS[i].t;if(i===CX_RANKS.length-1){const l=legend(nw);return l?`Legend ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][Math.min(9,l-1)]}`:r}return r}
function deptCost(k,l){return Math.round(25000*Math.pow(2.4,l)*(k==='fin'?1.3:1)/1000)*1000}
function deptMax(){const r=cx().rank;return r>=6?5:r>=5?4:3}
function capDay(s){try{const c=siteCaps(s);return c.perH*s.hours}catch(e){return 0}}
function ticket(type){const own=G.sites.filter(s=>s.type===type&&s.last&&s.last.cust);if(own.length){const r=own.reduce((a,s)=>a+s.last.rev,0),c=own.reduce((a,s)=>a+s.last.cust,0);return r/Math.max(1,c)}const b=BIZ[type];return b.products.reduce((a,p)=>a+p.ref,0)/b.products.length}
function slots(){const C=cx();return 2+Math.floor(C.rank/2)+Math.floor((C.dept.logi||0)/2)}

// ---------- hooks into the simulation ----------
const _vh=visitorsH;visitorsH=function(s,o){let v=_vh(s,o);const C=G&&G.cx;if(!C)return v;const b=BIZ[s.type],M=(CX_MARKETS.find(m=>m.id===C.market.id)||CX_MARKETS[0]).m;
 v*=(M[b.cat]||1)*(M.all||1)*(1+.06*(C.dept.mkt||0));return v};
const _sc=siteCaps;siteCaps=function(s){const c=_sc(s),C=G&&G.cx;if(C&&C.dept&&C.dept.rnd)c.quality=Math.min(100,c.quality+4*C.dept.rnd);return c};

const _sd=simDay;simDay=function(){const c0=G.cash;_sd.apply(this,arguments);try{careerDay(c0)}catch(e){console.warn('career',e)}};
const _ds=doSign;doSign=function(){const w=ui.wiz,C=cx(),need=w&&CX_LOCK[w.type];
 if(need!=null&&C.rank<need){toast(`${BIZ[w.type].n} unlocks at ${CX_RANKS[need].t}. Grow your net worth to ${fmt(CX_RANKS[need].nw)}.`,'warn');return}
 const open=G.sites.length,mx=CX_RANKS[C.rank].max;if(open>=mx){toast(`As a ${CX_RANKS[C.rank].t} you can run ${mx} businesses. Reach ${CX_RANKS[Math.min(C.rank+1,CX_RANKS.length-1)].t} to run more.`,'warn');return}
 return _ds.apply(this,arguments)};
const _mw=mWizard;mWizard=function(){let h=_mw();const C=cx();for(const t in CX_LOCK)if(C.rank<CX_LOCK[t])h=h.replace(new RegExp('(data-id="'+t+'"[^>]*>)'),`$1<span class="cxlock">🔒 ${CX_RANKS[CX_LOCK[t]].t}</span>`);return h};
const _rm=renderModal;renderModal=function(){const m=ui.modal;if(m&&(m.kind==='empire'||m.kind==='rankup'||m.kind==='report')){$('#modal').hidden=false;$('#modal .modal').innerHTML=m.kind==='empire'?mEmpire():m.kind==='rankup'?mRankup():mReport();return}return _rm()};
const _rt=renderTop;renderTop=function(){_rt.apply(this,arguments);try{cxTop()}catch(e){}};

// ---------- the day ----------
function careerDay(c0){
 const C=cx(),nw=netWorth(),open=G.sites.filter(s=>s.status==='open'),log=[];
 // market conditions rotate every 6-10 days
 if(G.day>=C.market.until){const prev=C.market.id;let m;do m=pick(CX_MARKETS);while(m.id===prev);C.market={id:m.id,until:G.day+6+Math.floor(R()*5)};news(`Market shift: ${m.n}. ${m.d}`,'market');log.push(['market',m.n])}
 // treasury interest
 if(C.dept.fin&&G.cash>0){const i=G.cash*.00015*C.dept.fin;G.cash+=i}
 // DISTRIBUTION: contracts consume spare capacity
 for(const k of C.contracts){const sites=open.filter(s=>s.type===k.type);let prog=0;
  for(const s of sites){const cap=capDay(s),used=s.last&&s.last.open?s.last.cust:0;prog+=Math.max(0,cap-used)*.9+cap*.12}
  prog*=1+.25*(C.dept.logi||0);prog=Math.min(prog,k.units-k.done);k.done+=prog;G.cash-=prog*k.unitCost;k.left--;}
 for(const k of C.contracts.slice()){if(k.done>=k.units-.5){C.contracts.splice(C.contracts.indexOf(k),1);G.cash+=k.pay;C.done++;try{window.cxMeet&&cxMeet(k)}catch(e){console.warn('contacts',e)}const cl=k.cl;C.rel=C.rel||{};C.rel[cl]=(C.rel[cl]||0)+1;
   for(const s of open.filter(s=>s.type===k.type))s.rep=Math.min(100,s.rep+2);news(`Contract delivered for ${k.cl}: +${fmt(k.pay)}`,'good');log.push(['done',k])}
  else if(k.left<=0){C.contracts.splice(C.contracts.indexOf(k),1);const pen=Math.round(k.pay*.3);G.cash-=pen;C.failed++;for(const s of open.filter(s=>s.type===k.type))s.rep=Math.max(0,s.rep-6);news(`Missed the ${k.cl} deadline. Penalty ${fmt(pen)} and a dent in your reputation`,'warn');log.push(['fail',k])}}
 // new offers every morning
 C.offers=C.offers.filter(o=>o.exp>G.day);if(C.rank>=1&&open.length){const n=Math.min(4,1+Math.floor(R()*2)+(C.rank>=4?1:0));for(let i=0;i<n&&C.offers.length<5;i++){const o=mkOffer(C,open);if(o){if(window.cxBoostOffer)cxBoostOffer(o);C.offers.push(o)}}}
 // RISK: regulator heat
 const dcs=open.filter(s=>s.type==='datacenter').length,shady=C.contracts.filter(k=>k.kind==='shady').length;
 C.heat+=Math.max(0,open.length-3)*.3+dcs*1.4+shady*1.2+(G.cash>2e6?.5:0)-(1.6+1.4*(C.dept.legal||0))-(window.cxHeatCool?cxHeatCool():0);C.heat=clamp(C.heat,0,100);
 if(C.heat>35&&R()<(C.heat-35)/260)incident(C,open,log);
 // rivals grow, and sometimes snipe
 for(const r of C.rivals){r.nw*=1+r.g+(R()-.5)*.02+(C.market.id==='recession'?-.004:0);if(R()<.004)r.g=rnd2(.003,.011)}

 const[cl,col]=pick(CX_CLIENTS[kind]);const sites=open.filter(s=>s.type===type),cap=sites.reduce((a,s)=>a+capDay(s),0)||40;
 const days=3+Math.floor(R()*8);

  else{P.conf=Math.max(.4,P.conf*.82);news(`Missed the quarterly target (${fmt(q.profit)} vs ${fmt(q.target)}). Shares slide`,'warn');log.push(['ipo','miss'])}

 banker:{n:'Banker',ic:'$',q:'"I know a guy at the bank. Actually, I am the guy at the bank."',

const CT_FIRST=['Margaret','Hiroshi','Daniel','Priya','Viktor','Amara','Lucas','Elena','Omar','Sofia','Graham','Chidi','Beatrix','Marcus','Ingrid','Tomás','Yasmin','Rupert','Nadia','Felix'];

function fixCost(){return Math.max(2000,Math.round(netWorth()*.004/100)*100)}
function ctList(){const C=cx();if(!C.contacts)C.contacts=[];return C.contacts}
function ctSum(role){let n=0;for(const c of ctList())if(c.role===role)n+=c.lvl;return n}
window.cxHeatCool=()=>ctSum('regulator')*.8+ctSum('fixer')*.6;
window.cxBoostOffer=o=>{const L=ctSum('rainmaker');if(L)o.pay=Math.round(o.pay*(1+.07*L)/10)*10};
window.cxMkOffer=()=>{const C=cx(),open=G.sites.filter(s=>s.status==='open');return open.length?mkOffer(C,open):null};
window.cxMeet=function(k){const C=cx(),nw=netWorth();
 if(!(ctList().length===0||k.pay>=Math.max(1500,nw*.005)||k.kind!=='local'))return;
 const L=ctList();let c=L.find(x=>x.cl===k.cl);
 if(c){if(c.lvl<3){c.lvl++;c.isNew=1;news(`${c.name} (${c.cl}) thinks highly of you now. Relationship level ${c.lvl}`,'good');toast(`📇 ${c.name} upgraded to level ${c.lvl}`,'good')}return}
 const owned=new Set(L.map(x=>x.role)),opts=CT_BYKIND[k.kind]||CT_BYKIND.local,fresh=opts.filter(r=>!owned.has(r)),role=pick(fresh.length?fresh:opts),title=CT_TITLE[k.kind]||'CEO';
 c={id:'c'+Math.floor(R()*1e9),cl:k.cl,col:k.col,kind:k.kind,name:pick(CT_FIRST)+' '+pick(CT_LAST),title,role,lvl:1,cd:0,day:G.day,isNew:1};L.push(c);
 news(`${c.name}, ${title} of ${c.cl}, left you their direct number`,'good');toast(`📇 New contact: ${c.name} (${c.cl})`,'good');try{pcTop()}catch(e){}};

const _vhc=visitorsH;visitorsH=function(s,o){let v=_vhc(s,o);const C=G&&G.cx;if(!C||!C.contacts)return v;const L=ctSum('adman');if(L)v*=1+.05*L;if(C.adBoost&&G.day<=C.adBoost.until)v*=C.adBoost.mult;return v};
const _llc=loanLimit;loanLimit=function(){let v=_llc();const L=G&&G.cx&&G.cx.contacts?ctSum('banker'):0;return L?Math.round(v*(1+.5*L)/1000)*1000:v};
// favors
function ctFavor(id){const C=cx(),c=ctList().find(x=>x.id===id);if(!c||G.day<c.cd)return;const nw=netWorth(),r=CT_ROLES[c.role],F=r.fav;
 if(c.role==='banker'){const P=Math.min(5e6,Math.max(15000,Math.round(nw*.06*c.lvl/1000)*1000));addLoan('business',P,.06,1095,'Friendly loan · '+c.name);G.cash+=P;toast(`${c.name} wired you ${fmt(P)} at 6%`,'good')}
 else if(c.role==='adman'){C.adBoost={until:G.day+5,mult:1.3+.1*(c.lvl-1)};toast('Billboards are up. Customers incoming','good')}
 else if(c.role==='regulator'){C.heat=Math.max(0,C.heat-(12+6*c.lvl));toast('Some paperwork went missing. Heat down','good')}
 else if(c.role==='rainmaker'){const o=cxMkOffer();if(!o){toast('Open a business first, then I can make calls','warn');return}o.pay=Math.round(o.pay*(1.2+.05*c.lvl)/10)*10;o.exp=G.day+4;o.seen=0;C.offers.unshift(o);toast(`${c.name} sent a client your way`,'good')}
 else if(c.role==='fixer'){const cost=fixCost();if(G.cash<cost){toast(`You need ${fmt(cost)} cash`,'warn');return}G.cash-=cost;C.heat=Math.max(0,C.heat-(25+5*c.lvl));toast('Problem handled. Heat down','good')}
 c.cd=G.day+F.cd;try{renderTop()}catch(e){}save();pcRender()}

<script>
// ANCAP LIFE · FLOW LAYER: one clear objective at a time, XP & level-up perk picks, profit streaks, end-of-day beats.
(function(){
const R=Math.random,fmt=v=>big(v);
function F(){if(!G)return null;if(!G.fl)G.fl={mi:0,xp:0,lvl:1,perks:{},streak:0,best:0,pendingPerk:0,choice:null,dn:0,cm:0,proc:null};return G.fl}

const reqOk=s=>BIZ[s.type].equip.filter(e=>e.req).every(e=>eqActive(s,e.id)>0);
const C=()=>(typeof cx==='function'?cx():{rank:0,done:0,heat:0,contracts:[],dept:{}});
// hand-built opening chain, then procedural missions forever
const MISSIONS=[
 {t:'Lease your first shop',h:'Zoom into a city and click a building glowing yellow.',p:()=>G.sites.length?1:0,r:0,x:40},
 {t:'Place the required kit',h:'Open your shop → Kit tab → Buy, then click the floor to place it.',p:()=>{const s=G.sites[0];if(!s)return 0;const q=BIZ[s.type].equip.filter(e=>e.req);return q.filter(e=>eqActive(s,e.id)>0).length/q.length},r:500,x:60,go:'equip'},
 {t:'Hire your first employee',h:'Staff tab → pick someone with good skill dots.',p:()=>G.sites.some(s=>s.staff.length)?1:0,r:300,x:40,go:'staff'},
 {t:'Stock your shelves',h:'Menu tab → buy a week of each supply.',p:()=>{const s=G.sites[0];if(!s)return 0;const k=bizSupplies(BIZ[s.type]);return k.filter(x=>s.inv[x]&&s.inv[x].q>0).length/k.length},r:300,x:40,go:'menu'},
 {t:'Open for business',h:'Overview tab → Open for business. Then speed time up.',p:()=>open().length?1:0,r:1000,x:80,go:'overview'},
 {t:'Serve 150 customers',h:'Keep the doors open. Speed up time with 3×.',p:()=>totCust()/150,r:800,x:80},
 {t:'Bank $1,000 profit',h:'Price near the market and keep stock topped up.',p:()=>Math.max(0,totProfit())/1000,r:1000,x:100},
 {t:'Add an extra piece of kit',h:'More kit = more capacity = more sales. Kit tab.',p:()=>G.sites.some(s=>BIZ[s.type].equip.some(e=>!e.req&&eqActive(s,e.id)>0)||BIZ[s.type].equip.some(e=>e.req&&eqActive(s,e.id)>1))?1:0,r:600,x:80,go:'equip'},
 {t:'Reach Shopkeeper rank',h:'Grow net worth to $75,000. Contracts unlock.',p:()=>netWorth()/75000,r:1500,x:150},
 {t:'Sign your first contract',h:'Empire button (top bar) → Contracts → Sign one you can deliver.',p:()=>(C().contracts.length||C().done)?1:0,r:800,x:100,emp:1},
 {t:'Open a second business',h:'Step outside, zoom out and lease another yellow building.',p:()=>Math.min(1,open().length/2),r:3000,x:200},
 {t:'Deliver 3 contracts',h:'Spare capacity fills contracts. Build beyond walk-in demand.',p:()=>C().done/3,r:2500,x:200,emp:1},
 {t:'Earn a three-star shop',h:'Quality, fair prices and no stockouts raise reputation.',p:()=>Math.max(0,...G.sites.map(s=>s.rep))/60,r:2000,x:150},
];
function procMission(f){const lv=f.lvl,k=Math.floor(R()*6),nw=netWorth();
 const T=[
  ()=>{const n=Math.round(Math.max(500,(G.lastProfit||300)*1.4)/50)*50;return{t:`Make ${fmt(n)} profit in one day`,h:'Fix your bottleneck, then add marketing.',kind:'day',n}},
  ()=>{const n=C().done+2+Math.floor(lv/4);return{t:`Deliver ${n-C().done} more contracts`,h:'Empire → Contracts.',kind:'con',n,emp:1}},
  ()=>{const n=open().length+1;return{t:`Run ${n} businesses at once`,h:'Lease another building. Mix business types for different markets.',kind:'biz',n}},
  ()=>{const n=Math.round(nw*1.35/1000)*1000;return{t:`Reach ${fmt(n)} net worth`,h:'Profit, buildings and stakes all count.',kind:'nw',n}},
  ()=>({t:'Keep regulator heat under 30 for 5 days',h:'Avoid shady deals; invest in Legal.',kind:'heat',n:5,c:0}),
  ()=>{const n=Math.min(95,Math.round(Math.max(...G.sites.map(s=>s.rep),40)+8));return{t:`Get a business to ${n} reputation`,h:'Quality kit, a manager, skilled staff.',kind:'rep',n}}];
 const m=T[k]();m.r=Math.round(Math.max(1500,nw*.03)/100)*100;m.x=120+lv*15;m.start=G.day;return m}
function procProg(m){const c=C();switch(m.kind){case'day':return Math.max(0,G.lastProfit)/m.n;case'con':return c.done/m.n;case'biz':return open().length/m.n;case'nw':return netWorth()/m.n;case'heat':return m.c/m.n;case'rep':return Math.max(...G.sites.map(s=>s.rep),0)/m.n}return 0}

const _sd=simDay;simDay=function(){const f=F(),c=C(),done0=c.done||0,offers0=new Set((c.offers||[]).map(o=>o.id));_sd.apply(this,arguments);try{dayEnd(f,c,done0,offers0)}catch(e){console.warn('flow',e)}};
function dayEnd(f,c,done0,offers0){

 const m=cur();if(m.kind==='heat'){m.c=(c.heat<30)?(m.c||0)+1:0}
 gainXP(xp);f.day={d:G.day,lp,bonus,streak:f.streak,xp};
