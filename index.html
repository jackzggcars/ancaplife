<script>
// keep the panels exactly one slab-gap below the top bar, whatever height the bar ends up at
(function(){const b=document.getElementById('bar');if(!b||!window.ResizeObserver)return;const set=()=>document.documentElement.style.setProperty('--bar-h',(b.offsetHeight+10)+'px');new ResizeObserver(set).observe(b);set()})();
// tapping a locked (disabled) button gives a little shake and a soft error tick, so it never feels dead
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('button:disabled');if(!t||!t.animate||typeof ui==='undefined'||!ui.started)return;t.animate([{transform:'none'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'none'}],{duration:320,easing:'ease-out'});try{if(typeof sfx==='function')sfx('err',250)}catch(_){}},true);

// ===================== OFFERS ON BUILDINGS YOU DON'T OWN =====================
// Every private building has a value you can read. Owners aren't selling, but each one has a hidden price (97%–114% of value).
function hshKey(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return((h>>>0)%10000)/10000}
function marketValue(lot){return bldgValue(econAt(lot.lat,lot.lon),lot,lot.floors)}
function reservePrice(lot){return Math.round(marketValue(lot)*(.97+hshKey(lot.key+'~r')*.17)/1000)*1000}
function offerBox(lot,st){
 if(!G||!lot||lot.landmark||!(lot.floors>0)||lotH(lot)<=0)return'';
 const v=marketValue(lot);
 if(st.st==='taken')return`<div class="box offerbox"><div class="price"><span class="mono">${big(v)}</span><small>estimated value</small></div><p class="muted">Owned by another player. It can't be bought.</p></div>`;
 const key=lot.key,amt=(ui.offer&&ui.offer[key])||Math.round(v/1000)*1000,cd=(G.offerCD||{})[key],locked=cd!=null&&G.day<cd,dp=Math.round(amt*.3),m=ui.offerMsg&&ui.offerMsg.key===key?ui.offerMsg:null;
 const msg=m?(m.kind==='counter'?`<div class="offmsg counter"><b>The owner counters at <span class="mono">${big(m.price)}</span>.</b><div class="btnrow" style="margin-top:8px"><button class="btn" data-act="acceptcounter" data-mort="0" ${G.cash<m.price?'disabled':''}>Accept · pay ${big(m.price)}</button><button class="btn ghost" data-act="acceptcounter" data-mort="1" ${G.cash<Math.round(m.price*.3)?'disabled':''}>Accept · mortgage</button></div></div>`:`<div class="offmsg no">${esc(m.t)}</div>`):'';
 return`<div class="box offerbox"><div class="price"><span class="mono">${big(v)}</span><small>estimated value · not for sale</small></div>
 <p class="muted">The owner hasn't listed it, but most owners have a price. Offer at or near its value and they may sell.</p>
 <div class="offrow"><button class="ghost sm" data-act="offerstep" data-d="-5" aria-label="Lower offer 5%">−5%</button><input id="offer-in" type="number" step="1000" min="0" value="${amt}" data-change="offer" aria-label="Your offer"><button class="ghost sm" data-act="offerstep" data-d="5" aria-label="Raise offer 5%">+5%</button></div>
 ${msg}
 <div class="btnrow"><button class="btn" data-act="makeoffer" data-mort="0" ${locked||G.cash<amt?'disabled':''}>Make offer</button><button class="btn ghost" data-act="makeoffer" data-mort="1" ${locked||G.cash<dp?'disabled':''}>Offer · ${big(dp)} down</button></div>
 ${locked?`<p class="warn">They won't talk again until tomorrow${cd-G.day>1?' or later':''}.</p>`:''}<p class="fine">Mortgage: 30% down, 6.5% APR over 20 years.</p></div>`;
}
function offerAmount(){const i=document.getElementById('offer-in');return i?Math.max(0,Math.round(parseFloat(i.value)||0)):0}
function offerSay(lot,kind,t,price){ui.offerMsg={key:lot.key,kind,t,price};renderLeft()}
function submitOffer(lot,amt,mort){
 const st=lotState(lot);if(st.st==='taken'||st.st==='player'||st.st==='build'||st.st==='plot')return;
 G.offerCD=G.offerCD||{};ui.offer=ui.offer||{};ui.offer[lot.key]=amt;
 const cd=G.offerCD[lot.key];if(cd!=null&&G.day<cd){offerSay(lot,'no','The owner is not taking calls right now.');return}
 if(amt<1000){offerSay(lot,'no','Name a real number.');return}
 const down=mort?Math.round(amt*.3):amt;if(G.cash<down){offerSay(lot,'no',`You need ${big(down-G.cash)} more cash for that offer.`);sfx('err');return}
 const v=marketValue(lot),res=reservePrice(lot);
 if(amt>=res){completeOffer(lot,amt,mort);return}
 if(amt>=res*.93){sfx('select');offerSay(lot,'counter','',res);return}
 let pt=null;try{pt=lotScreen(lot)}catch(e){}
 if(amt>=v*.8){G.offerCD[lot.key]=G.day+1;offerSay(lot,'no','Turned down. "Not enough." Come back tomorrow with a better number.')}
 else{G.offerCD[lot.key]=G.day+3;offerSay(lot,'no','They laughed. That wasn\'t close. Don\'t expect a call back for three days.')}
 sfx('err');try{shake(.2);if(pt)floatText('DECLINED',pt[0],pt[1]-10,'spend')}catch(e){}
 save();
}
function completeOffer(lot,price,mort){
 const st=lotState(lot),down=mort?Math.round(price*.3):price;if(G.cash<down){toast('Not enough cash for that deal','warn');return}
 const was=st.st==='rival'&&st.name?st.name:null;
 ui.offerMsg=null;if(ui.offer)delete ui.offer[lot.key];if(G.offerCD)delete G.offerCD[lot.key];
 buyLot(lot,mort,false,price);
 if(was)news(`${was} closed after the building was sold from under it`,'city');
}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.change==='offer'&&typeof ui!=='undefined'&&ui.selLot){ui.offer=ui.offer||{};ui.offer[ui.selLot.key]=Math.round(parseFloat(t.value)||0);if(ui.offerMsg&&ui.offerMsg.kind==='counter')ui.offerMsg=null}});
document.addEventListener('click',e=>{
 const t=e.target.closest&&e.target.closest('[data-act]');if(!t||typeof G==='undefined'||!G||!ui.selLot)return;
 const a=t.dataset.act,lot=ui.selLot;
 if(a==='offerstep'){const base=offerAmount()||Math.round(marketValue(lot)/1000)*1000;ui.offer=ui.offer||{};ui.offer[lot.key]=Math.max(1000,Math.round(base*(1+ +t.dataset.d/100)/1000)*1000);ui.offerMsg=null;renderLeft()}
 else if(a==='makeoffer')submitOffer(lot,offerAmount(),t.dataset.mort==='1');
 else if(a==='acceptcounter'){const m=ui.offerMsg;if(m&&m.key===lot.key&&m.kind==='counter')completeOffer(lot,m.price,t.dataset.mort==='1')}
});

// ===================== SELECTION FX v2 =====================
// state colour, a light band that sweeps up the walls, corner posts, rising sparks, a pop on select, repeating ground ripples
const SELCOL={player:0x6fd48a,sale:0x2fd3e6,lease:0xffde00,rival:0xff4b3e,occ:0xffb347,plot:0xffde00,build:0xffffff,taken:0xb98cff};
function selStyle(lot){let k='occ';try{const st=lotState(lot).st;k=(siteAtKey(lot.key)||propAtKey(lot.key))?'player':st}catch(e){}
 return{k,col:SELCOL[k]||0xffde00,tag:{player:'YOURS',sale:'FOR SALE',lease:'FOR LEASE',rival:'COMPETITOR',occ:'PRIVATELY OWNED',plot:'BARE LAND',build:'UNDER CONSTRUCTION',taken:'OTHER PLAYER'}[k]||''}}
let SELFX=null,SPARKTEX=null,selFxKey=null;
function sparkTex(){if(SPARKTEX)return SPARKTEX;const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d'),g=x.createRadialGradient(16,16,0,16,16,16);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,32,32);return SPARKTEX=new THREE.CanvasTexture(c)}
function clearSelFX(){if(!SELFX)return;const f=SELFX;SELFX=null;f.grp.parent&&f.grp.parent.remove(f.grp);f.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
function buildSelFX(lot,info,col,fresh){
 const r=info.r,n=r.length,h=Math.max(.6,lotH(lot)+1),grp=new THREE.Group(),C=new THREE.Color(col),pos=[];
 for(let k=0;k<n;k++){const a=r[k],b=r[(k+1)%n];pos.push(a[0],.3,-a[1],b[0],.3,-b[1],b[0],h,-b[1],a[0],.3,-a[1],b[0],h,-b[1],a[0],h,-a[1])}
 const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 const U={uT:{value:0},uK:{value:prefersReduced||!fresh?2:0},uH:{value:h},uC:{value:C}};
 const wm=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:'uniform float uH;varying float vy;void main(){vy=clamp((position.y-.3)/max(.1,uH-.3),0.,1.);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying float vy;uniform float uT,uK;uniform vec3 uC;void main(){if(vy>uK)discard;float t=fract(uT*.42);float b1=exp(-pow((vy-t)*7.,2.));float b2=exp(-pow((vy-fract(t+.5))*9.,2.))*.5;float top=smoothstep(.9,1.,vy);float base=(1.-vy)*.16+.05;float a=base+b1*.5+b2*.3+top*.55;gl_FragColor=vec4(uC*1.15,clamp(a,0.,1.)*.8);}'});
 const wall=new THREE.Mesh(wg,wm);wall.renderOrder=17;wall.frustumCulled=false;grp.add(wall);
 // corner posts
 const cp=[],step=Math.max(1,Math.ceil(n/16));for(let k=0;k<n;k+=step){const a=r[k];cp.push(a[0],h,-a[1],a[0],h+4,-a[1])}
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(cp,3));
 const posts=new THREE.LineSegments(pg,new THREE.LineBasicMaterial({color:col,depthTest:false,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));posts.renderOrder=21;grp.add(posts);
 // perimeter sampling for sparks
 const seg=[];let per=0;for(let k=0;k<n;k++){const a=r[k],b=r[(k+1)%n],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,l,per]);per+=l}
 const N=Math.min(70,22+n*3),sp=[],sx=new Float32Array(N),sz=new Float32Array(N);
 for(let i=0;i<N;i++){const u=Math.random()*per;let q=seg[seg.length-1];for(const g of seg)if(u<=g[3]+g[2]){q=g;break}const f=q[2]>0?(u-q[3])/q[2]:0;sx[i]=q[0][0]+(q[1][0]-q[0][0])*f;sz[i]=-(q[0][1]+(q[1][1]-q[0][1])*f);sp.push({sp:.18+Math.random()*.32,ph:Math.random()})}
 const spg=new THREE.BufferGeometry();spg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));spg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(N*3),3));
 const pts=new THREE.Points(spg,new THREE.PointsMaterial({size:7,map:sparkTex(),vertexColors:true,transparent:true,depthTest:false,depthWrite:false,sizeAttenuation:false,blending:THREE.AdditiveBlending}));pts.renderOrder=24;pts.frustumCulled=false;grp.add(pts);
 // burst of sparks on first select
 let burst=null;
 if(fresh&&!prefersReduced){const M=30,bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(M*3),3));bg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(M*3),3));
  const vel=[];for(let i=0;i<M;i++){const an=Math.random()*6.283,s=(.5+Math.random())*info.rad*1.3;vel.push([Math.cos(an)*s,8+Math.random()*16,Math.sin(an)*s])}
  const bp=new THREE.Points(bg,new THREE.PointsMaterial({size:9,map:sparkTex(),vertexColors:true,transparent:true,depthTest:false,depthWrite:false,sizeAttenuation:false,blending:THREE.AdditiveBlending}));bp.renderOrder=25;bp.frustumCulled=false;grp.add(bp);burst={pts:bp,vel,M}}
 info.L.grp.add(grp);
 SELFX={grp,U,posts,info,col,C,h,N,sp,sx,sz,spg,burst,t0:performance.now(),lastRing:performance.now()}
}
function updSelFX(now){
 const f=SELFX;if(!f||!f.grp.parent)return;const t=(now-f.t0)/1000;f.U.uT.value=t;
 if(f.U.uK.value<2&&!prefersReduced){const k=Math.min(1,t/.5);f.U.uK.value=(1-Math.pow(1-k,3))*1.1+(k>=1?1:0)}
 f.posts.material.opacity=.55+.4*Math.sin(now*.008);
 const P=f.spg.attributes.position.array,Cc=f.spg.attributes.color.array,c=f.C;
 for(let i=0;i<f.N;i++){const s=f.sp[i],life=(t*s.sp+s.ph)%1,y=.3+life*(f.h+5),fd=Math.sin(Math.PI*life)*(.5+.5*Math.min(1,t*2));
  P[i*3]=f.sx[i]+Math.sin(t*2+i)*.25;P[i*3+1]=y;P[i*3+2]=f.sz[i];Cc[i*3]=c.r*fd;Cc[i*3+1]=c.g*fd;Cc[i*3+2]=c.b*fd}
 f.spg.attributes.position.needsUpdate=true;f.spg.attributes.color.needsUpdate=true;
 if(f.burst){const b=f.burst,bt=t;if(bt>1.1){f.grp.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();f.burst=null}else{
  const bp=b.pts.geometry.attributes.position.array,bc=b.pts.geometry.attributes.color.array,fd=Math.pow(1-bt/1.1,1.5);
  for(let i=0;i<b.M;i++){bp[i*3]=f.info.c[0]+b.vel[i][0]*bt;bp[i*3+1]=f.h+b.vel[i][1]*bt-14*bt*bt;bp[i*3+2]=-f.info.c[1]+b.vel[i][2]*bt;bc[i*3]=Math.min(1,c.r+.35)*fd;bc[i*3+1]=Math.min(1,c.g+.35)*fd;bc[i*3+2]=Math.min(1,c.b+.35)*fd}
  b.pts.geometry.attributes.position.needsUpdate=true;b.pts.geometry.attributes.color.needsUpdate=true}}
 if(!prefersReduced&&now-f.lastRing>1800){f.lastRing=now;ringFX(f.info,0,f.info.rad*1.5,f.col,1.1)}
}
(function(){const prev=drawSel;
 drawSel=function(){
  clearSelFX();prev.apply(this,arguments);
  try{const lot=ui.selLot;if(!lot){selFxKey=null;return}if(!SEL)return;
   const info=lotInfo(lot);if(!info)return;const sty=selStyle(lot),fresh=lot.key!==selFxKey;selFxKey=lot.key;
   try{SEL.material.color.setHex(sty.col);if(FILL)FILL.material.color.setHex(sty.col)}catch(e){}
   buildSelFX(lot,info,sty.col,fresh);
   if(fresh){
    try{shake(.14);punch(.5)}catch(e){}
    let sp=null;try{sp=lotScreen(lot)}catch(e){}
    if(sp&&sty.tag)floatText(sty.tag,sp[0],sp[1]-32,'info');
    if(sp&&(sty.k==='occ'||sty.k==='rival'||sty.k==='lease')&&lot.floors>0&&!lot.landmark){const v=marketValue(lot);setTimeout(()=>{if(ui.selLot&&ui.selLot.key===lot.key)floatText('≈ '+big(v),sp[0],sp[1]-6,'info')},260)}
    if(sty.k==='sale')sfx('coin',0,1)}
  }catch(e){}
 }})();
(function loop(now){try{updSelFX(now)}catch(e){}requestAnimationFrame(loop)})(performance.now());
</script>
<script>
// ===================== ANCAP LIFE · INVENTORY =====================
// Click a rack / shelf / fridge / machine inside a shop to see the exact items stored there.
// The single source of truth is still s.inv[supply].q (what the Menu tab shows and what sales draw down).
// On top of that each supply is split into specific items (blue tee, green pants, house-blend beans...) in s.inv[supply].v.
// The split is reconciled against q every time it is read, so the two can never disagree.
const INV={sel:null,open:false,mode:'item',idx:null,eq:null,site:null,title:'',prev:{},dl:{}};

// ---------- item pictures (inline SVG, no network) ----------
const IV_S='#0c0c0c';
function ivShade(h,f){if(!/^#[0-9a-f]{6}$/i.test(h))return h;const n=parseInt(h.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const m=f<1?0:255,t=f<1?1-f:f-1;r=Math.round(r+(m-r)*t);g=Math.round(g+(m-g)*t);b=Math.round(b+(m-b)*t);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const ivO=`stroke="${IV_S}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"`;
const ivP=(d,f,x)=>`<path d="${d}" fill="${f}" ${ivO} ${x||''}/>`;
const ivR=(x,y,w,h,f,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r||0}" fill="${f}" ${ivO}/>`;
const ivC=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${ivO}/>`;
const ivE=(x,y,rx,ry,f)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${ivO}/>`;
const ivL=(x1,y1,x2,y2,c,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w||2}" stroke-linecap="round"/>`;
const ivT=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round"/>`;
const IV_PAPER='#f2efe4';
const IV_SHAPE={
 shirt:a=>ivP('M20 10 L28 8 Q32 14 36 8 L44 10 L57 21 L50 29 L45 25 L45 55 L19 55 L19 25 L14 29 L7 21 Z',a)+ivT('M28 8 Q32 14 36 8',ivShade(a,.6),2.5)+ivL(19,25,19,55,ivShade(a,.8),1.5),
 pants:a=>ivP('M18 8 H46 L49 56 H35 L32 30 L29 56 H15 Z',a)+ivR(18,8,28,6,ivShade(a,.78))+ivL(32,14,32,30,ivShade(a,.65),1.5)+ivT('M21 17 V30 M43 17 V30',ivShade(a,1.5),1.5)+ivC(32,11,1.6,'#e8c54a'),
 jacket:a=>ivP('M20 10 L27 8 L32 15 L37 8 L44 10 L56 22 L52 50 L46 48 L46 56 L18 56 L18 48 L12 50 L8 22 Z',a)+ivP('M27 8 L32 15 L37 8 L35 20 L32 15 L29 20 Z',ivShade(a,.7))+ivL(32,15,32,56,ivShade(a,.55),2)+ivR(21,40,8,8,ivShade(a,.82),1)+ivR(35,40,8,8,ivShade(a,.82),1),
 paperbag:a=>ivT('M24 22 V13 Q32 6 40 13 V22','#0c0c0c',2.5)+ivP('M13 20 H51 L53 56 H11 Z',a)+ivP('M13 20 H51 L52 27 H12 Z',ivShade(a,.82))+ivC(32,41,7,IV_PAPER)+ivT('M28 41 H36',IV_S,2),
 coffeebag:(a,b)=>ivP('M16 12 H48 L51 56 H13 Z',a)+ivP('M16 12 H48 L48.5 20 H15.5 Z',ivShade(a,.78))+ivE(32,38,10,12,b||IV_PAPER)+ivE(32,38,4.5,7,ivShade(a,.7))+ivT('M32 31 Q34 38 32 45',b||IV_PAPER,1.5),

function ivDefs(sid){
 if(IV_CACHE[sid])return IV_CACHE[sid];

}

// ---------- per-item stock, always reconciled against the real supply total ----------
function ivEnsure(s,sid){
 const inv=s.inv&&s.inv[sid];if(!inv)return null;const D=ivDefs(sid);
 if(!inv.v||typeof inv.v!=='object')inv.v={};
 let t=0;for(const d of D){const x=inv.v[d.id];inv.v[d.id]=typeof x==='number'&&x>0?x:0;t+=inv.v[d.id]}
 const q=Math.max(0,inv.q);
 if(Math.abs(t-q)>1e-6){
  if(q<=0)for(const d of D)inv.v[d.id]=0;
  else if(t>1e-9){const f=q/t;for(const d of D)inv.v[d.id]*=f}
  else{const W=D.reduce((a,d)=>a+d.w,0);for(const d of D)inv.v[d.id]=q*d.w/W}
 }
 return D;
}
// sales: today's mix of what customers grabbed (popular lines go faster, with some day-to-day whim)
function invSell(s,sid,qq,inv){
 try{
  const D=ivEnsure(s,sid);if(!D||!(qq>0))return;
  let left=qq;const sold={},wt=D.map(d=>d.w*(.5+Math.random()));
  for(let pass=0;pass<5&&left>1e-9;pass++){
   let W=0;D.forEach((d,i)=>{if(inv.v[d.id]>1e-9)W+=wt[i]});if(W<=0)break;
   let took=0;D.forEach((d,i)=>{const have=inv.v[d.id];if(have<=1e-9)return;const t=Math.min(have,left*wt[i]/W);inv.v[d.id]-=t;took+=t;sold[d.id]=(sold[d.id]||0)+t});
   left-=took;
  }
  inv.sv=inv.sv||{};for(const k in sold)inv.sv[k]=(inv.sv[k]||0)+sold[k];
 }catch(e){}
}

function invAdd(s,sid,units,inv){
 try{
  const D=ivEnsure(s,sid);if(!D||!(units>0))return;
  const T=Math.max(0,inv.q)+units,W=D.reduce((a,d)=>a+d.w,0),def=D.map(d=>Math.max(0,T*d.w/W-inv.v[d.id])),Sd=def.reduce((a,x)=>a+x,0);
  if(Sd>=units)D.forEach((d,i)=>inv.v[d.id]+=units*def[i]/Sd);
  else{D.forEach((d,i)=>inv.v[d.id]+=def[i]);const rest=units-Sd;D.forEach(d=>inv.v[d.id]+=rest*d.w/W)}
 }catch(e){}
}

 let body='',units=0,lines=0,detail='';
 for(const k of sids){
  const S=SUP[k],inv=s.inv[k],q=inv?Math.max(0,inv.q):0,per=need[k]||0,days=per>0?q/per:Infinity,step=q<10?.1:1;

  let rem=tot-al.reduce((a,x)=>a+x.f,0);al.map((x,i)=>[x.r,i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){al[i].f++;rem--}});
  units+=q;lines++;
  const cards=D.map((d,i)=>{
   const v=inv?inv.v[d.id]:0,c=al[i].f*step,tgt=per>0?per*s.days*d.w/W:Math.max(v,1);
   const pct=clamp(tgt>0?v/tgt*100:0,0,100),out=c<=0,low=!out&&per>0&&v<tgt*.25,sv=inv&&inv.sv&&inv.sv[d.id]||0;
   const key=s.id+':'+d.id,pv=INV.prev[key],now=performance.now();

   const ch=INV.dl[key],age=ch?(now-ch.t)/1000:99,dl=ch&&age<4.5?ch.d:0,fresh=dl&&ch.fresh;if(ch)ch.fresh=false;
   const selOn=INV.sel===key;

   return`<button type="button" class="ivc${out?' out':low?' low':''}${fresh?' flash':''}${selOn?' sel':''}" data-act="invsel" data-key="${key}" title="${esc(d.n)}" aria-label="${esc(d.n)}: ${ivFmt(c,step)}">
